name: Cloud Build Deploy

on: 
  push:
    branches:
      - main

jobs: 
  build-deploy:
    runs-on: ubuntu-latest
    secrets: inherit
    env:
      PROJECT_ID: alert-nimbus-354910
      APP_ENGINE_JSON: ${{ secrets.APP_ENGINE_JSON }}
      ABDM_SBX_CLIENT_ID: ${{ secrets.ABDM_SBX_CLIENT_ID }}
      ABDM_SBX_CLIENT_SECRET: ${{ secrets.ABDM_SBX_CLIENT_SECRET }}

    # permissions
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    # Checkout the repository
    - name: Checkout Code
      uses: actions/checkout@v3

    - id: 'auth'
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ env.APP_ENGINE_JSON }}

    # Set up Google Cloud SDK
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with: 
        project_id: ${{ env.PROJECT_ID }}
        # service_account_key: ${{ secrets.APP_ENGINE_JSON }}
        export_default_credentials: true
    
    # Verify authentication
    - name: Verify Authentication
      run: gcloud auth list
    
    # Trigger Cloud Build
    - name: Trigger Cloud Build
      run: |
          gcloud builds submit . \
            --substitutions=_ABDM_SBX_CLIENT_ID="$ABDM_SBX_CLIENT_ID,_ABDM_SBX_CLIENT_SECRET=$ABDM_SBX_CLIENT_SECRET