name: Cloud Build Deploy

on: 
  push:
    branches:
      - main

env:
  PROJECT_ID: alert-nimbus-354910
  APP_ENGINE_JSON: ${{ vars.APP_ENGINE_JSON }}
  ABDM_SBX_CLIENT_ID: ${{ vars.ABDM_SBX_CLIENT_ID }} 
  ABDM_SBX_CLIENT_SECRET: ${{ secrets.ABDM_SBX_CLIENT_SECRET }}

jobs: 
  build-deploy:
    runs-on: ubuntu-latest

    # permissions
    permissions:
      contents: 'read' 
      id-token: 'write'

    steps:
    # Checkout the repository
    - name: Checkout Code
      uses: actions/checkout@v3

    # Verify environment variables
    - name: Print Environment Variables
      run: |
        echo "PROJECT_ID: $PROJECT_ID"
        echo "APP_ENGINE_JSON: ${APP_ENGINE_JSON:0:10}"
        echo "ABDM_SBX_CLIENT_ID: ${ABDM_SBX_CLIENT_ID:0:10}"
        echo "ABDM_SBX_CLIENT_SECRET: ${ABDM_SBX_CLIENT_SECRET:0:10}"

    # - id: 'auth'
    #   uses: google-github-actions/auth@v1
    #   with:
    #     credentials_json: $APP_ENGINE_JSON

    # # Set up Google Cloud SDK
    # - name: Set up Cloud SDK
    #   uses: google-github-actions/setup-gcloud@v1
    #   with: 
    #     project_id: $PROJECT_ID
    #     service_account_key: $APP_ENGINE_JSON
    #     # service_account_key: ${{ secrets.APP_ENGINE_JSON }}
    #     export_default_credentials: true
    
    # # Verify authentication
    # - name: Verify Authentication
    #   run: gcloud auth list
    
    # # Trigger Cloud Build
    # - name: Trigger Cloud Build
    #   run: |
    #       gcloud builds submit . \
    #         --substitutions=_ABDM_SBX_CLIENT_ID=$ABDM_SBX_CLIENT_ID,_ABDM_SBX_CLIENT_SECRET=$ABDM_SBX_CLIENT_SECRET

    # Build the backend
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/serverside',
      '-f', 'Dockerfile',
      '.'
    ]
    dir: 'service/abdm'

  # Build the frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/clientside',
      '-f', 'Dockerfile',
      '.'
    ]
    dir: '../../client/abdm-client'

  # Push images to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/serverside']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/clientside']

  # Deploy the backend
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'serverside-abdm', 
      '--image', 'gcr.io/$PROJECT_ID/serverside', 
      '--platform', 'managed', 
      '--region', 'asia-south1', 
      '--allow-unauthenticated',
      '--set-env-vars', 'ABDM_SBX_CLIENT_ID=$ABDM_SBX_CLIENT_ID,ABDM_SBX_CLIENT_SECRET=$ABDM_SBX_CLIENT_SECRET',
      '--timeout', '600s'
    ]

  # Deploy the frontend
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'clientside-abdm', 
      '--image', 'gcr.io/$PROJECT_ID/clientside', 
      '--platform', 'managed', 
      '--region', 'asia-south1', 
      '--allow-unauthenticated',
      '--timeout', '600s'
    ]
  
  options:
  logging: CLOUD_LOGGING_ONLY