name: Cloud Build Deploy

on: 
  push:
    branches:
      - main

jobs: 
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout Code
      uses: actions/checkout@v3

    # Authenticate with Google Cloud
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.APP_ENGINE_JSON }}

    # Set up Google Cloud SDK
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with: 
        project_id: 'alert-nimbus-354910'
    
    # Trigger Cloud Build
    - name: Trigger Cloud Build
      run: |
          gcloud builds submit . \
            --substitutions=_ABDM_SBX_CLIENT_ID="${{ secrets.ABDM_SBX_CLIENT_ID }}",_ABDM_SBX_CLIENT_SECRET="${{ secrets.ABDM_SBX_CLIENT_SECRET }}"