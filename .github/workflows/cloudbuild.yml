jobs: 
  build-deploy:
    runs-on: ubuntu-latest

    # permissions
    permissions:
      contents: 'read' 
      id-token: 'write'

    steps:
    # Checkout the repository
    - name: Checkout Code
      uses: actions/checkout@v3

    # Verify environment variables
    - name: Print Environment Variables
      run: |
        echo "PROJECT_ID: $PROJECT_ID"
        echo "APP_ENGINE_JSON: ${APP_ENGINE_JSON:0:10}"
        echo "ABDM_SBX_CLIENT_ID: ${ABDM_SBX_CLIENT_ID:0:10}"
        echo "ABDM_SBX_CLIENT_SECRET: ${ABDM_SBX_CLIENT_SECRET:0:10}"

    - id: 'auth'
      uses: google-github-actions/auth@v1
      with:
        credentials_json: $APP_ENGINE_JSON

    # Set up Google Cloud SDK
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with: 
        project_id: $PROJECT_ID
        # service_account_key: $APP_ENGINE_JSON
        # service_account_key: ${{ secrets.APP_ENGINE_JSON }}
        export_default_credentials: true
    
    # Verify authentication
    - name: Verify Authentication
      run: gcloud auth list
    
     # Trigger Cloud Build
    - name: Trigger Cloud Build
      run: |
        gcloud builds submit . \
          --substitutions=_ABDM_SBX_CLIENT_ID=$ABDM_SBX_CLIENT_ID,_ABDM_SBX_CLIENT_SECRET=$ABDM_SBX_CLIENT_SECRET

            