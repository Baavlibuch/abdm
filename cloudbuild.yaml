steps:
  # Fetch secrets from Google Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ABDM_SBX_CLIENT_ID=$(gcloud secrets versions access latest --secret="ABDM_SBX_CLIENT_ID")
        ABDM_SBX_CLIENT_SECRET=$(gcloud secrets versions access latest --secret="ABDM_SBX_CLIENT_SECRET")
        echo "ABDM_SBX_CLIENT_ID=$ABDM_SBX_CLIENT_ID" >> /workspace/env_vars
        echo "ABDM_SBX_CLIENT_SECRET=$ABDM_SBX_CLIENT_SECRET" >> /workspace/env_vars

  # Load the environment variables
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/env_vars
        echo "ABDM_SBX_CLIENT_ID: ${ABDM_SBX_CLIENT_ID:0:10}..."
        echo "ABDM_SBX_CLIENT_SECRET: ${ABDM_SBX_CLIENT_SECRET:0:3}..."

  # Build and push the clientside image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/clientside', './client/abdm-client']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/clientside']

  # Deploy the backend
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'serverside-abdm', 
      '--image', 'gcr.io/$PROJECT_ID/serverside', 
      '--platform', 'managed', 
      '--region', 'asia-south1', 
      '--allow-unauthenticated',
      '--set-env-vars', '_ABDM_SBX_CLIENT_ID=$ABDM_SBX_CLIENT_ID,_ABDM_SBX_CLIENT_SECRET=$ABDM_SBX_CLIENT_SECRET',
      '--timeout', '600s'
    ]

  # Deploy the frontend
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'clientside-abdm', 
      '--image', 'gcr.io/$PROJECT_ID/clientside', 
      '--platform', 'managed', 
      '--region', 'asia-south1', 
      '--allow-unauthenticated',
      '--timeout', '600s'
    ]

options:
  logging: CLOUD_LOGGING_ONLY