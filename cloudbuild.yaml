steps:
  # Build and push the serverside image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/serverside', './service/abdm']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/serverside']

  # Build and push the clientside image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/clientside', './client/abdm-client']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/clientside']

  # Deploy the backend
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'serverside-abdm', 
      '--image', 'gcr.io/$PROJECT_ID/serverside', 
      '--platform', 'managed', 
      '--region', 'asia-south1', 
      '--allow-unauthenticated',
      '--set-env-vars', 'ABDM_SBX_CLIENT_SECRET=projects/$PROJECT_ID/secrets/ABDM_SBX_CLIENT_SECRET/versions/latest,ABDM_SBX_CLIENT_ID=projects/$PROJECT_ID/secrets/ABDM_SBX_CLIENT_ID/versions/latest',
      '--timeout', '600s'
    ]

  # Deploy the frontend
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'clientside-abdm', 
      '--image', 'gcr.io/$PROJECT_ID/clientside', 
      '--platform', 'managed', 
      '--region', 'asia-south1', 
      '--allow-unauthenticated',
      '--set-env-vars', 'REACT_APP_ABDM_SBX_CLIENT_SECRET=projects/$PROJECT_ID/secrets/ABDM_SBX_CLIENT_SECRET/versions/latest,REACT_APP_ABDM_SBX_CLIENT_ID=projects/$PROJECT_ID/secrets/ABDM_SBX_CLIENT_ID/versions/latest',
      '--timeout', '600s'
    ]

substitutions:
  _ABDM_SBX_CLIENT_ID: 'default-placeholder'
  _ABDM_SBX_CLIENT_SECRET: 'default-placeholder'

options:
  logging: CLOUD_LOGGING_ONLY