steps:
  # Build and push the serverside image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/serverside', './service/abdm']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/serverside']

  # Build and push the clientside image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/clientside', './client/abdm-client']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/clientside']

  # Deploy the backend
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'serverside-abdm', 
      '--image', 'gcr.io/$PROJECT_ID/serverside', 
      '--platform', 'managed', 
      '--region', 'asia-south1', 
      '--allow-unauthenticated',
      '--timeout', '600s'
    ]

  # Deploy the backend service using cloud-run-service.yaml
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'services', 'replace', 'cloud-run-service.yaml', 
      '--region', 'asia-south1'
    ]

  # Deploy the frontend
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'clientside-abdm', 
      '--image', 'gcr.io/$PROJECT_ID/clientside', 
      '--platform', 'managed', 
      '--region', 'asia-south1', 
      '--allow-unauthenticated',
      '--timeout', '600s'
    ]

options:
  logging: CLOUD_LOGGING_ONLY