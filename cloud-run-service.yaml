apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: serverside-abdm # $SERVICE_NAME
spec:
  template:
    spec:
      containers:
        - image: gcr.io/alert-nimbus-354910/serverside
          env:
          - name: ABDM_SBX_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: ABDM_SBX_CLIENT_ID
                key: latest
          - name: ABDM_SBX_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: ABDM_SBX_CLIENT_SECRET
                key: latest